name: Feature request
description: Suggest an idea or improvement.
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: Please check the [roadmap](https://github.com/nclskpprs/Agent-Editor/blob/main/docs/ROADMAP.md) first — your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which problem would this solve? What do you do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from a user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      description: Ame stays lean. Please confirm your idea fits.
      options:
        - label: This does not require indexing the whole project or running a language server by default.
