name: Bug report
description: Something does not work as expected.
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please search existing issues first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open project ...
        2. Start agent ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ame version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (installed)
        - Windows (portable)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.2, Ubuntu 24.04, Windows 11 24H2
  - type: input
    id: agent
    attributes:
      label: Agent involved (if any)
      placeholder: e.g. Claude Code 2.x, Codex CLI, Aider
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant log output or attach screenshots.
      render: text
