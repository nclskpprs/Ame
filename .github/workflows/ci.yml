name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier + ESLint)
        run: pnpm lint
      - name: Type check (svelte-check)
        run: pnpm check
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Build
        run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (embedded by Tauri)
        run: pnpm build
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: IPC bindings are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- src/lib/ipc/bindings.ts; then
            echo "::error::src/lib/ipc/bindings.ts is stale. Run 'cargo test --workspace' and commit the result."
            exit 1
          fi

  bench:
    name: Benchmark (startup, memory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build release binary
        run: pnpm tauri build --no-bundle
      # Temporary: find the ~30 s startup delay on the runner (docs/PROGRESS.md).
      - name: Diagnose the environment
        continue-on-error: true
        run: |
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
          ls -la "/run/user/$(id -u)" || true
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          which bwrap xdg-dbus-proxy dbus-run-session || true
          dpkg -l libwebkit2gtk-4.1-0 | tail -1
      - name: 'Diagnose: plain'
        continue-on-error: true
        run: xvfb-run --auto-servernum node scripts/bench.mjs --runs 1 --no-fail
      - name: 'Diagnose: with a session bus'
        continue-on-error: true
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/bench.mjs --runs 1 --no-fail
      - name: 'Diagnose: without the WebKit sandbox'
        continue-on-error: true
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: xvfb-run --auto-servernum node scripts/bench.mjs --runs 1 --no-fail
      - name: 'Diagnose: without the accessibility bridge'
        continue-on-error: true
        env:
          NO_AT_BRIDGE: '1'
        run: xvfb-run --auto-servernum node scripts/bench.mjs --runs 1 --no-fail
      - name: Measure startup time and idle memory
        # The web view needs a display; xvfb provides a virtual one.
        run: xvfb-run --auto-servernum node scripts/bench.mjs --runs 5
