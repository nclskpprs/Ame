# Git hooks, installed by `pnpm install` (see the `prepare` script).
# pre-commit runs the fast checks on staged files, pre-push the full suite.

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{js,ts,svelte,json,css,html,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    - name: eslint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: rustfmt
      glob: '*.rs'
      run: cargo fmt --all -- --check

pre-push:
  jobs:
    - name: verify
      run: pnpm verify
